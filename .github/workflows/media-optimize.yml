name: Media optimize (R2)

# Optimiza (reduce) los adjuntos de mantenimiento del bucket R2 en producción:
#   - vídeos -> política por vídeo (ver "POLÍTICA DE VÍDEO"): remux sin pérdida,
#               solo marcar, o recodificar a MP4 H.264 con el lado CORTO <= 720 px
#   - fotos  -> JPEG con lado mayor <= 1600 px, calidad 75, sin metadatos
# Se ejecuta ANTES de "Media backup (R2 to R2)" (03:13 vs 03:43 UTC) para que el
# bucket de backup solo reciba las versiones ligeras. Los dos workflows comparten
# el grupo de concurrencia "media-pipeline" y nunca se solapan.
#
# ATENCIÓN: este workflow REEMPLAZA los originales a propósito (el propietario
# acepta perderlos). Por eso: dry-run por defecto en ejecuciones manuales, límite
# de objetos, verificación de cada fichero antes de reemplazar, y aislamiento de
# fallos por objeto (un fallo no detiene el resto; el job acaba en rojo al final).
#
# Secrets necesarios (nunca se imprimen):
#   R2_BACKUP_ENDPOINT                 https://<account-id>.r2.cloudflarestorage.com
#   R2_MEDIA_RW_ACCESS_KEY_ID          \ token R2 de lectura, escritura y borrado de
#   R2_MEDIA_RW_SECRET_ACCESS_KEY      / objetos SOLO sobre sleepingbcn-manteniment
#   SUPABASE_DB_URL                    URI del Session pooler (usuario postgres)
#
# Idempotencia: cada objeto ya procesado lleva el metadato personalizado
# optimized=1 y se salta en las siguientes ejecuciones. Los objetos con 0 filas en
# manteniment_adjunts (huérfanos, p. ej. una subida en curso) no se tocan nunca.
# Solo se opera sobre claves manteniment/<id>/<fichero>; el audio (.m4a) y los
# documentos (.pdf/.doc/.docx) no se tocan. Se clasifica por extensión / content
# type, NO por la columna tipus.
#
# Variable de repositorio MEDIA_OPTIMIZE_SCHEDULE_ENABLED: las ejecuciones
# PROGRAMADAS solo corren si vale 'true' (interruptor de seguridad hasta validar
# el paso 4 del plan). Las manuales (workflow_dispatch) corren siempre.
#
# Input manual opcional only_ext: lista de extensiones en minúsculas separadas por
# comas (p. ej. "mov" o "mov,m4v"). Si no está vacío, solo se consideran los
# objetos cuya extensión esté en la lista (en el dry-run y en las ejecuciones
# reales, además de "kinds"). Las ejecuciones programadas usan el valor vacío.
#
# POLÍTICA DE VÍDEO (se decide con ffprobe sobre el original descargado)
#   - REMUX (sin pérdida): H.264, lado corto <= 720, bitrate de vídeo <= 2 Mbit/s y
#     contenedor .mov -> -c:v copy a .mp4 (audio copiado si es AAC, si no AAC 128k),
#     +faststart, la rotación se conserva.
#   - SOLO MARCAR: ya es .mp4 H.264, lado corto <= 720 y <= 2 Mbit/s.
#   - RECODIFICAR en cualquier otro caso (H.264 por encima de los umbrales, HEVC u
#     otro códec, lado corto > 720): libx264 con los inputs crf (def. 23) y preset
#     (def. medium), yuv420p, lado corto <= 720 sin ampliar, AAC 128k, +faststart.
#     Solo se conserva si pesa <= 75% del original (>= 25% menos); si no, un H.264 en
#     .mov se remuxa y uno ya en .mp4 se marca. HEVC/otros códecs se recodifican
#     siempre (compatibilidad), aunque el ahorro sea menor.
#   - Si cambia la extensión de la clave (p. ej. .MOV -> .mp4), la transacción de BD
#     actualiza también manteniment_adjunts.nom_fitxer (solo vídeos).
#   - Fotos: sin cambios.
#
# PLAN DE DESPLIEGUE
#   1) Ejecución manual con dry_run=true (solo lista candidatos y totales).
#   2) Primero, con un clip real de iPhone: manual con dry_run=false, limit=2,
#      kinds=videos, only_ext=mov, y comprobar que los colores NO salen lavados
#      (HDR/10 bit sin tone mapping); si salen lavados, avisar y parar. Después,
#      manual con dry_run=false, limit=3, kinds=videos y comprobar en la app los
#      vídeos (se reproducen, en vertical si procede, con audio).
#   3) Manual con dry_run=false, limit=10, kinds=photos y revisión visual.
#   4) Ejecución completa manual (dry_run=false, limit=0, kinds=all). Después,
#      crear la variable MEDIA_OPTIMIZE_SCHEDULE_ENABLED=true.
#   5) El propietario lanza a mano "Media backup (R2 to R2)" una vez y reactiva su
#      schedule. Mientras tanto, media-backup está DESACTIVADO por el propietario.

on:
  schedule:
    - cron: "13 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo listar candidatos y totales (no descarga, no convierte, no sube, no borra, no escribe en BD)"
        type: boolean
        default: true
      limit:
        description: "Máximo de objetos a procesar en esta ejecución (0 = sin límite)"
        type: number
        default: 0
      kinds:
        description: "Qué optimizar"
        type: choice
        options:
          - all
          - photos
          - videos
        default: all
      only_ext:
        description: "Solo estas extensiones, separadas por comas y en minúsculas (p. ej. mov,m4v). Vacío = todas"
        type: string
        default: ""
      crf:
        description: "CRF de libx264 para recodificar vídeos (entero 18-32; menor = más calidad)"
        type: string
        default: "23"
      preset:
        description: "Preset de libx264 para recodificar vídeos"
        type: choice
        options:
          - veryfast
          - fast
          - medium
          - slow
        default: medium

permissions:
  contents: read

concurrency:
  group: media-pipeline
  cancel-in-progress: false

jobs:
  optimize:
    name: Optimizar adjuntos
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MEDIA_OPTIMIZE_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # ImageMagick para las fotos: libjpeg real (progresivo, 4:2:0), -auto-orient y
      # -strip fiables. ffmpeg/ffprobe para los vídeos. Solo se instala (apt) lo que
      # falte; con reintentos y timeouts de red para fallar rápido en vez de colgarse
      # (un fallo transitorio de red del runner dejó este paso 36 minutos parado).
      - name: Instalar herramientas
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          pkgs=()
          command -v aws >/dev/null 2>&1 || { echo "::error::Falta awscli en el runner y no se instala por apt."; exit 1; }
          { command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; } || pkgs+=(ffmpeg)
          { command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1; } || pkgs+=(imagemagick)
          command -v jq >/dev/null 2>&1 || pkgs+=(jq)
          command -v psql >/dev/null 2>&1 || pkgs+=(postgresql-client)

          if [ "${#pkgs[@]}" -gt 0 ]; then
            echo "Instalando con apt: ${pkgs[*]}"
            APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
            if ! sudo apt-get update -qq "${APT_OPTS[@]}"; then
              echo "::warning::apt-get update ha fallado; se intenta instalar con los índices actuales."
            fi
            if ! sudo apt-get install -y -qq "${APT_OPTS[@]}" "${pkgs[@]}"; then
              echo "::error::No se han podido instalar los paquetes (${pkgs[*]}); posible fallo de red del runner."
              exit 1
            fi
          else
            echo "Todas las herramientas ya están instaladas; se omite apt."
          fi

          aws --version
          ffmpeg -version | head -1
          ffprobe -version | head -1
          (magick -version 2>/dev/null || convert -version) | head -1
          jq --version
          psql --version

      - name: Optimizar adjuntos
        timeout-minutes: 140
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_RW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_RW_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MEDIA_BUCKET: sleepingbcn-manteniment
          # En ejecuciones programadas no existen inputs: se fuerza dry_run=false,
          # limit=0 y kinds=all (la ejecución real).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '0' }}
          KINDS: ${{ github.event_name == 'workflow_dispatch' && inputs.kinds || 'all' }}
          ONLY_EXT: ${{ github.event_name == 'workflow_dispatch' && inputs.only_ext || '' }}
          CRF: ${{ github.event_name == 'workflow_dispatch' && inputs.crf || '23' }}
          PRESET: ${{ github.event_name == 'workflow_dispatch' && inputs.preset || 'medium' }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/media-optimize"
          SCRIPT="${RUNNER_TEMP}/media-optimize.sh"
          cat > "$SCRIPT" <<'MEDIA_OPTIMIZE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          BUCKET="${MEDIA_BUCKET:?}"
          EP="${R2_BACKUP_ENDPOINT:?}"
          RUN_DIR="${RUNNER_TEMP:?}/media-optimize"
          KEY_RE='^manteniment/[0-9]+/[^/[:space:]]+$'

          s3api() { aws s3api --endpoint-url "$EP" "$@"; }

          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          # Nunca se toca nada fuera de manteniment/<id>/<fichero>.
          assert_key() {
            if ! [[ "$1" =~ $KEY_RE ]]; then
              echo "Clave fuera del patrón permitido: $1" >&2
              return 1
            fi
          }

          ext_of() {
            local f="${1##*/}"
            if [[ "$f" == *.* ]]; then lower "${f##*.}"; else echo ""; fi
          }

          kind_of() {
            case "$(ext_of "$1")" in
              jpg|jpeg|png|webp) echo photo ;;
              heic|heif) echo heic ;;
              mp4|mov|m4v|webm|3gp) echo video ;;
              m4a|pdf|doc|docx|mp3|aac|wav|ogg|opus|txt|csv|xls|xlsx) echo ignore ;;
              *) echo unknown ;;
            esac
          }

          # Filas de manteniment_adjunts que apuntan a la clave (solo lectura).
          db_count() {
            psql "$SUPABASE_DB_URL" -X -q -At -v ON_ERROR_STOP=1 -v k="$1" <<'SQL'
          select count(*) from public.manteniment_adjunts where url = :'k';
          SQL
          }

          # absent | present | present-optimized
          key_state() {
            local out
            if out="$(s3api head-object --bucket "$BUCKET" --key "$1" --query 'Metadata.optimized' --output text 2>&1)"; then
              if [ "$out" = "1" ]; then echo present-optimized; else echo present; fi
            elif [[ "$out" == *"404"* || "$out" == *"Not Found"* ]]; then
              echo absent
            else
              echo "head-object ha fallado: $out" >&2
              return 1
            fi
          }

          object_size() {
            s3api head-object --bucket "$BUCKET" --key "$1" --query 'ContentLength' --output text
          }

          # Lista "clave<TAB>tamaño" de todo manteniment/ (el CLI pagina solo).
          list_all() {
            s3api list-objects-v2 --bucket "$BUCKET" --prefix manteniment/ \
              --query 'Contents[].[Key,Size]' --output text | awk -F'\t' 'NF==2'
          }

          totals() { awk -F'\t' '{n++; s+=$2} END{printf "%d %d\n", n+0, s+0}' "$1"; }

          # ---------------------------------------------------------------- conversión
          if command -v magick >/dev/null 2>&1; then
            CONVERT=(magick)
            IDENTIFY=(magick identify)
          else
            CONVERT=(convert)
            IDENTIFY=(identify)
          fi

          # Foto -> JPEG: orientación EXIF aplicada, lado mayor <= 1600 (sin ampliar),
          # sin metadatos, calidad 75, 4:2:0, progresivo. Transparencias sobre blanco.
          convert_photo() {
            local in="$1" out="$2"
            "${CONVERT[@]}" "${in}[0]" -auto-orient -background white -alpha remove -alpha off \
              -strip -resize '1600x1600>' -sampling-factor 4:2:0 -interlace Plane -quality 75 "$out"
          }

          # --- Vídeo ---
          # Umbral de bitrate de vídeo para "ya está bien" (remux / solo marcar).
          REMUX_MAX_BPS=2000000

          # ffprobe del original: define V_CODEC V_W V_H V_BR (puede venir vacío) V_DUR
          # A_CODEC (vacío si no hay audio). Devuelve != 0 si no se puede leer.
          probe_video() {
            local f="$1" out k v
            V_CODEC="" V_W="" V_H="" V_BR="" V_DUR="" A_CODEC=""
            out="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,bit_rate -of default=noprint_wrappers=1 "$f")" || return 1
            while IFS='=' read -r k v; do
              case "$k" in
                codec_name) V_CODEC="$v" ;;
                width) V_W="$v" ;;
                height) V_H="$v" ;;
                bit_rate) V_BR="$v" ;;
              esac
            done <<<"$out"
            A_CODEC="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$f")" || return 1
            V_DUR="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f")" || return 1
            [ -n "$V_CODEC" ] && [[ "$V_W" =~ ^[0-9]+$ ]] && [[ "$V_H" =~ ^[0-9]+$ ]] \
              && [[ "$V_DUR" =~ ^[0-9]+(\.[0-9]+)?$ ]] && awk -v d="$V_DUR" 'BEGIN{exit !(d>0)}'
          }

          # Recodificar: libx264 (CRF y preset de los inputs), lado CORTO <= 720 sin
          # ampliar (lados pares), yuv420p, AAC 128k, faststart. ffmpeg aplica la rotación
          # (autorotate) antes del filtro, así que iw/ih son los reales. Apaisado:
          # alto = min(720, ih), ancho automático par. Vertical/cuadrado: ancho =
          # min(720, iw), alto automático par.
          reencode_video() {
            local in="$1" out="$2"
            timeout 25m ffmpeg -nostdin -hide_banner -loglevel error -y -i "$in" \
              -map 0:v:0 -map '0:a:0?' -sn -dn -map_metadata -1 \
              -vf "scale='if(gt(iw,ih),-2,trunc(min(720,iw)/2)*2)':'if(gt(iw,ih),trunc(min(720,ih)/2)*2,-2)'" \
              -c:v libx264 -preset "${PRESET:-medium}" -crf "${CRF:-23}" -pix_fmt yuv420p \
              -c:a aac -b:a 128k -movflags +faststart "$out"
          }

          # Remux sin pérdida a .mp4: vídeo copiado (la matriz de rotación se conserva),
          # audio copiado si es AAC y, si no, AAC 128k. Solo se usa con H.264.
          remux_video() {
            local in="$1" out="$2" acodec="$3" audio=()
            if [ "$acodec" = aac ]; then
              audio=(-c:a copy)
            elif [ -n "$acodec" ]; then
              audio=(-c:a aac -b:a 128k)
            fi
            timeout 25m ffmpeg -nostdin -hide_banner -loglevel error -y -i "$in" \
              -map 0:v:0 -map '0:a:0?' -sn -dn -c:v copy "${audio[@]}" \
              -movflags +faststart "$out"
          }

          # Verifica la salida: existe, se lee, códec esperado (y lado corto <= 720 si se
          # recodificó) y duración dentro de max(1 s, 2%). Define O_CODEC O_W O_H.
          # Uso: verify_video <salida> <duración original> <reencode|remux> <códec original>
          verify_video() {
            local out="$1" din="$2" mode="$3" vcodec="$4"
            [ -s "$out" ] || { echo "salida vacía" >&2; return 1; }
            probe_video "$out" || { echo "ffprobe no puede leer la salida" >&2; return 1; }
            O_CODEC="$V_CODEC"; O_W="$V_W"; O_H="$V_H"
            if [ "$mode" = reencode ]; then
              if [ "$O_CODEC" != h264 ] || [ "$(( O_W < O_H ? O_W : O_H ))" -gt 720 ]; then
                echo "códec/tamaño de salida inesperado" >&2; return 1
              fi
            elif [ "$O_CODEC" != "$vcodec" ]; then
              echo "el remux ha cambiado el códec" >&2; return 1
            fi
            awk -v a="$din" -v b="$V_DUR" 'BEGIN{d=a-b; if(d<0)d=-d; t=a*0.02; if(t<1)t=1; exit !(d<=t)}' \
              || { echo "la duración difiere demasiado" >&2; return 1; }
          }

          content_type_for() {
            case "$(ext_of "$1")" in
              jpg|jpeg) echo image/jpeg ;;
              png) echo image/png ;;
              webp) echo image/webp ;;
              mp4|m4v) echo video/mp4 ;;
              mov) echo video/quicktime ;;
              webm) echo video/webm ;;
              3gp) echo video/3gpp ;;
              *) echo application/octet-stream ;;
            esac
          }

          # "Mantener el original y solo marcarlo": copy-object sobre sí mismo.
          mark_only() {
            local key="$1" ct
            assert_key "$key"
            ct="$(s3api head-object --bucket "$BUCKET" --key "$key" --query 'ContentType' --output text)"
            if [ -z "$ct" ] || [ "$ct" = "None" ]; then ct="$(content_type_for "$key")"; fi
            s3api copy-object --bucket "$BUCKET" --key "$key" --copy-source "${BUCKET}/${key}" \
              --metadata-directive REPLACE --metadata optimized=1 --content-type "$ct" >/dev/null
          }

          # Descubrimiento: estado del objeto + content type con UN head-object.
          # Se ejecuta en paralelo (xargs -P) y escribe "clave<TAB>estado<TAB>ct".
          # Estado: absent | present | present-optimized. Un error inesperado de
          # head-object hace fallar la ejecución (nunca se trata como "no optimizado").
          probe() {
            local key out opt ct state
            key="$1"
            if out="$(s3api head-object --bucket "$BUCKET" --key "$key" --query '[Metadata.optimized, ContentType]' --output text 2>&1)"; then
              IFS=$'\t' read -r opt ct <<<"$out"
              if [ "$opt" = "1" ]; then state=present-optimized; else state=present; fi
              printf '%s\t%s\t%s\n' "$key" "$state" "${ct:-}"
            elif [[ "$out" == *"404"* || "$out" == *"Not Found"* ]]; then
              printf '%s\tabsent\t\n' "$key"
            else
              echo "head-object ha fallado: $out" >&2
              return 1
            fi
          }

          # Cambia la clave en BD (transacción, filas afectadas == filas encontradas).
          # Con 4º argumento (extensión nueva, solo vídeos) también corrige la extensión
          # final de nom_fitxer en la MISMA transacción y con la misma aserción de filas.
          db_rekey() {
            local old="$1" new="$2" expected="$3" ext="${4:-}" result
            result="$(psql "$SUPABASE_DB_URL" -X -q -At -v ON_ERROR_STOP=1 \
              -v old="$old" -v new="$new" -v expected="$expected" -v ext="$ext" <<'SQL'
          begin;
          with u as (
            update public.manteniment_adjunts
               set url = :'new',
                   nom_fitxer = case when :'ext' <> '' and nom_fitxer is not null
                                     then regexp_replace(nom_fitxer, '\.[^./]+$', '') || '.' || :'ext'
                                     else nom_fitxer end
             where url = :'old'
            returning 1)
          select count(*) as n from u \gset
          select (:n = :expected) as ok \gset
          \if :ok
          commit;
          \echo UPDATED_OK
          \else
          rollback;
          \echo UPDATED_MISMATCH
          \endif
          SQL
            )"
            [[ "$result" == *UPDATED_OK* ]]
          }

          # Códigos de salida de "one": 0 reemplazado, 10 solo marcado, 11 huérfano,
          # cualquier otro = fallo. Nunca se imprimen claves aquí (las imprime main
          # solo en los fallos).
          one() {
            local kind="$1" key="$2" size="$3"
            assert_key "$key"

            # Directorio de trabajo único de este objeto. WORKDIR es GLOBAL (no local)
            # y lo borra el trap EXIT del despachador, instalado a nivel de script: así
            # la limpieza no depende de variables locales de la función, no puede fallar
            # con "unbound variable" y es best-effort (nunca cambia el código de salida).
            WORKDIR="$(mktemp -d "${RUN_DIR}/obj.XXXXXX")"
            local tmp="$WORKDIR"

            local file="${key##*/}" prefix="${key%/*}" stem ext out_ext out_ct same
            ext="$(ext_of "$key")"
            if [[ "$file" == *.* ]]; then stem="${file%.*}"; else stem="$file"; fi

            if [ "$kind" = photo ]; then
              out_ext=jpg; out_ct=image/jpeg
              if [ "$ext" = jpg ] || [ "$ext" = jpeg ]; then same=1; else same=0; fi
            else
              out_ext=mp4; out_ct=video/mp4
              if [ "$ext" = mp4 ]; then same=1; else same=0; fi
            fi
            local newkey="$key"
            if [ "$same" = 0 ]; then newkey="${prefix}/${stem}.${out_ext}"; fi
            assert_key "$newkey"

            # Huérfano (0 filas): no se toca (también protege una subida en curso).
            local rows
            rows="$(db_count "$key")"
            if [ "$rows" -lt 1 ]; then echo "huérfano: omitido"; return 11; fi

            # Reintento tras una caída entre el PUT y la BD: el nuevo objeto ya existe y
            # está marcado -> se reutiliza sin volver a convertir.
            local reuse=0
            if [ "$newkey" != "$key" ]; then
              case "$(key_state "$newkey")" in
                present-optimized) reuse=1 ;;
                present) echo "la clave destino ya existe sin marcar" >&2; return 1 ;;
                absent) ;;
              esac
            fi

            local in="$tmp/in" out="$tmp/out" out_size=0
            if [ "$reuse" = 0 ]; then
              s3api get-object --bucket "$BUCKET" --key "$key" "$in" >/dev/null
              local in_size
              in_size="$(stat -c %s "$in")"
              if [ "$in_size" -le 0 ]; then echo "original vacío" >&2; return 1; fi

              if [ "$kind" = photo ]; then
                local w h
                read -r w h < <("${IDENTIFY[@]}" -format '%w %h' "${in}[0]")
                convert_photo "$in" "${out}.jpg"
                out="${out}.jpg"
                [ -s "$out" ] || { echo "salida vacía" >&2; return 1; }
                "${CONVERT[@]}" "$out" null:            # decodificación completa
                local w2 h2
                read -r w2 h2 < <("${IDENTIFY[@]}" -format '%w %h' "$out")
                awk -v w="$w" -v h="$h" -v w2="$w2" -v h2="$h2" 'BEGIN{
                  li=(w>h)?w:h; si=(w>h)?h:w; lo=(w2>h2)?w2:h2; so=(w2>h2)?h2:w2;
                  el=(li>1600)?1600:li; d=lo-el; if(d<0)d=-d;
                  if (d>1) exit 1;
                  r=(so*li-si*lo)/(si*lo); if(r<0)r=-r; if (r>0.02) exit 1; exit 0 }' \
                  || { echo "dimensiones inesperadas" >&2; return 1; }
                out_size="$(stat -c %s "$out")"
                echo "foto: ${in_size} -> ${out_size} bytes (ratio $(awk -v a="$out_size" -v b="$in_size" 'BEGIN{printf "%.2f", a/b}'))"
                if ! (( out_size * 10 <= in_size * 9 )); then
                  mark_only "$key"
                  echo "$kind $in_size $in_size" >> "$RUN_DIR/bytes.tsv"
                  return 10
                fi
              else
                local vcodec vw vh vbr acodec din short decision low=0 vdesc
                probe_video "$in" || { echo "ffprobe no puede leer el original" >&2; return 1; }
                vcodec="$V_CODEC"; vw="$V_W"; vh="$V_H"; acodec="$A_CODEC"; din="$V_DUR"
                short=$(( vw < vh ? vw : vh ))
                vbr="$V_BR"
                if ! [[ "$vbr" =~ ^[0-9]+$ ]]; then
                  vbr="$(awk -v s="$in_size" -v d="$din" 'BEGIN{printf "%d", s*8/d}')"   # bitrate medio del fichero
                fi
                vdesc="source=${vcodec} ${vw}x${vh} ${vbr}bps"

                if [ "$vcodec" = h264 ] && [ "$short" -le 720 ] && [ "$vbr" -le "$REMUX_MAX_BPS" ]; then low=1; fi
                if [ "$low" = 1 ] && [ "$ext" = mp4 ]; then
                  decision=mark
                elif [ "$low" = 1 ] && [ "$ext" = mov ]; then
                  decision=remux
                else
                  decision=reencode
                fi

                out="${out}.mp4"
                if [ "$decision" = reencode ]; then
                  reencode_video "$in" "$out"
                  verify_video "$out" "$din" reencode "$vcodec" || return 1
                  out_size="$(stat -c %s "$out")"
                  # Solo se conserva si pesa <= 75% del original. HEVC/otros códecs se
                  # recodifican siempre (compatibilidad); un H.264 que no encoge vuelve
                  # a remux (.mov u otro contenedor) o se marca (.mp4).
                  if [ "$vcodec" = h264 ] && ! (( out_size * 100 <= in_size * 75 )); then
                    if [ "$ext" = mp4 ]; then decision=mark; else decision=remux; fi
                  fi
                fi
                if [ "$decision" = remux ]; then
                  remux_video "$in" "$out" "$acodec"
                  verify_video "$out" "$din" remux "$vcodec" || return 1
                  out_size="$(stat -c %s "$out")"
                fi
                if [ "$decision" = mark ]; then
                  echo "decision=mark ${vdesc} -> ${in_size} bytes (ratio 1.00)"
                  mark_only "$key"
                  echo "$kind $in_size $in_size" >> "$RUN_DIR/bytes.tsv"
                  return 10
                fi
                echo "decision=${decision} ${vdesc} -> ${out_size} bytes (ratio $(awk -v a="$out_size" -v b="$in_size" 'BEGIN{printf "%.2f", a/b}'))"
              fi

              # (a) subir el nuevo contenido (PUT atómico) y confirmar el tamaño.
              assert_key "$newkey"
              s3api put-object --bucket "$BUCKET" --key "$newkey" --body "$out" \
                --content-type "$out_ct" --metadata optimized=1 >/dev/null
              local remote
              remote="$(object_size "$newkey")"
              [ "$remote" = "$out_size" ] || { echo "el tamaño remoto no coincide tras el PUT" >&2; return 1; }
            else
              local in_size
              in_size="$size"
              out_size="$(object_size "$newkey")"
              [ "$out_size" -gt 0 ] || { echo "objeto reutilizado vacío" >&2; return 1; }
            fi

            # (b) clave nueva: actualizar la BD (todas las filas) y (c) borrar el original.
            local deleted=0
            if [ "$newkey" != "$key" ]; then
              rows="$(db_count "$key")"
              if [ "$rows" -lt 1 ]; then echo "huérfano tras subir: no se actualiza ni se borra nada" >&2; return 11; fi
              local chg_ext=""
              if [ "$kind" = video ]; then chg_ext="$out_ext"; fi
              db_rekey "$key" "$newkey" "$rows" "$chg_ext" || { echo "la actualización de BD no coincide; revertida" >&2; return 1; }
              assert_key "$key"
              if s3api delete-object --bucket "$BUCKET" --key "$key" >/dev/null; then
                deleted=1
              else
                echo "::warning::no se ha podido borrar el original (queda como sobrante)"
              fi
            fi

            echo "$kind $in_size $out_size" >> "$RUN_DIR/bytes.tsv"
            if [ "$deleted" = 1 ]; then echo x >> "$RUN_DIR/deleted.log"; fi
            return 0
          }

          # ------------------------------------------------------------------- main
          main() {
            : "${DRY_RUN:?}" "${LIMIT:?}" "${KINDS:?}"
            local only_ext=""
            only_ext="$(lower "${ONLY_EXT:-}")"
            only_ext="${only_ext//[[:space:]]/}"
            if [ -n "$only_ext" ]; then only_ext=",${only_ext},"; fi
            [[ "$LIMIT" =~ ^[0-9]+$ ]] || LIMIT="${LIMIT%%.*}"
            if ! [[ "${CRF:-}" =~ ^[0-9]+$ ]] || [ "$CRF" -lt 18 ] || [ "$CRF" -gt 32 ]; then
              echo "::error::crf debe ser un entero entre 18 y 32 (recibido: '${CRF:-}')"
              return 1
            fi
            case "${PRESET:-}" in
              veryfast|fast|medium|slow) ;;
              *) echo "::error::preset no válido: '${PRESET:-}'"; return 1 ;;
            esac
            : > "$RUN_DIR/candidates.tsv"; : > "$RUN_DIR/bytes.tsv"
            : > "$RUN_DIR/deleted.log"; : > "$RUN_DIR/failed.txt"; : > "$RUN_DIR/orphans.txt"

            local T0=$SECONDS
            echo "Modo: dry_run=${DRY_RUN} limit=${LIMIT} kinds=${KINDS} only_ext=${ONLY_EXT:-} crf=${CRF} preset=${PRESET}"
            list_all > "$RUN_DIR/list_before.tsv"
            local before_n before_b
            read -r before_n before_b < <(totals "$RUN_DIR/list_before.tsv")
            echo "Bucket antes: ${before_n} objetos, ${before_b} bytes"

            # --- Descubrimiento ---
            # 1) Clasificación por extensión y filtros (sin red).
            local heic=0 kind key size
            : > "$RUN_DIR/pre.tsv"
            while IFS=$'\t' read -r -u 3 key size; do
              [[ "$key" == manteniment/* ]] || continue
              [[ "$key" == */ ]] && continue
              if [ -n "$only_ext" ] && [[ "$only_ext" != *",$(ext_of "$key"),"* ]]; then continue; fi
              kind="$(kind_of "$key")"
              case "$kind" in
                heic) heic=$((heic + 1)); continue ;;
                ignore) continue ;;
                photo) if [ "$KINDS" = videos ]; then continue; fi ;;
                video) if [ "$KINDS" = photos ]; then continue; fi ;;
                # Extensión desconocida: solo puede acabar siendo vídeo (por content type).
                unknown) if [ "$KINDS" = photos ]; then continue; fi ;;
              esac
              printf '%s\t%s\t%s\n' "$kind" "$key" "$size" >> "$RUN_DIR/pre.tsv"
            done 3< "$RUN_DIR/list_before.tsv"
            local pre_n
            pre_n="$(wc -l < "$RUN_DIR/pre.tsv")"

            # 2) Una sola consulta (solo lectura) con las filas por clave en BD.
            psql "$SUPABASE_DB_URL" -X -q -At -F $'\t' -v ON_ERROR_STOP=1 \
              -c 'select url, count(*) from public.manteniment_adjunts group by url' \
              > "$RUN_DIR/db_urls.tsv"

            # 3) head-object en paralelo (8 a la vez) solo para los objetos restantes.
            : > "$RUN_DIR/probe.tsv"
            if [ "$pre_n" -gt 0 ]; then
              cut -f2 "$RUN_DIR/pre.tsv" \
                | xargs -d '\n' -r -n 1 -P 8 bash "$0" probe > "$RUN_DIR/probe.tsv" &
              local xpid=$!
              while kill -0 "$xpid" 2>/dev/null; do
                sleep 5
                echo "head-object: $(wc -l < "$RUN_DIR/probe.tsv")/${pre_n}"
              done
              wait "$xpid"   # falla (y con set -e aborta) si algún head-object ha fallado
            fi

            declare -A STATE CTYPE ROWS
            local st ct n
            while IFS=$'\t' read -r key st ct; do STATE["$key"]="$st"; CTYPE["$key"]="$ct"; done < "$RUN_DIR/probe.tsv"
            while IFS=$'\t' read -r key n; do ROWS["$key"]="$n"; done < "$RUN_DIR/db_urls.tsv"

            # 4) Reparto en candidatos / ya optimizados / huérfanos.
            local already=0 orphans=0 cand_photo=0 cand_video=0 cand_bytes=0 seen=0
            while IFS=$'\t' read -r -u 3 kind key size; do
              seen=$((seen + 1))
              if [ $((seen % 25)) -eq 0 ]; then echo "discovery: ${seen}/${pre_n}"; fi
              if [ "$kind" = unknown ]; then
                ct="${CTYPE[$key]:-}"
                if [[ "$ct" == video/* ]]; then kind=video; else continue; fi
              fi
              st="${STATE[$key]:?sin resultado de head-object}"
              if [ "$st" = present-optimized ]; then already=$((already + 1)); continue; fi
              if [ "${ROWS[$key]:-0}" -lt 1 ]; then
                orphans=$((orphans + 1)); echo "$key" >> "$RUN_DIR/orphans.txt"; continue
              fi
              printf '%s\t%s\t%s\n' "$kind" "$key" "$size" >> "$RUN_DIR/candidates.tsv"
              cand_bytes=$((cand_bytes + size))
              if [ "$kind" = photo ]; then cand_photo=$((cand_photo + 1)); else cand_video=$((cand_video + 1)); fi
            done 3< "$RUN_DIR/pre.tsv"
            echo "Descubrimiento terminado en $((SECONDS - T0)) s"

            echo "Candidatos: ${cand_photo} fotos, ${cand_video} vídeos (${cand_bytes} bytes); ya optimizados: ${already}; huérfanos: ${orphans}; HEIC/HEIF ignorados: ${heic}"

            if [ "$DRY_RUN" = true ]; then
              {
                echo "### Media optimize — DRY RUN (no se ha modificado nada)"
                echo "| Concepto | Valor |"
                echo "|---|---:|"
                echo "| Fotos candidatas | ${cand_photo} |"
                echo "| Vídeos candidatos | ${cand_video} |"
                echo "| Bytes de candidatos | ${cand_bytes} |"
                echo "| Ya optimizados | ${already} |"
                echo "| Huérfanos (0 filas en BD) | ${orphans} |"
                echo "| HEIC/HEIF ignorados | ${heic} |"
                echo "| Bucket: objetos / bytes | ${before_n} / ${before_b} |"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Duración total: $((SECONDS - T0)) s"
              return 0
            fi

            local total selected replaced=0 marked=0 failed=0 orphans2=0 attempted=0 consec=0 aborted=0 rc
            total="$(wc -l < "$RUN_DIR/candidates.tsv")"
            # limit = nº de objetos INTENTADOS (con éxito o con fallo); 0 = sin límite.
            selected="$total"
            if [ "$LIMIT" -gt 0 ] && [ "$LIMIT" -lt "$total" ]; then selected="$LIMIT"; fi
            if [ "$LIMIT" -gt 0 ]; then
              echo "Límite aplicado: ${selected} de ${total} candidatos"
            else
              echo "Sin límite: ${total} candidatos"
            fi
            head -n "$selected" "$RUN_DIR/candidates.tsv" > "$RUN_DIR/selected.tsv"
            while IFS=$'\t' read -r -u 3 kind key size; do
              attempted=$((attempted + 1))
              echo "[${attempted}/${selected}] ${kind}, ${size} bytes"
              rc=0
              bash "$0" one "$kind" "$key" "$size" </dev/null || rc=$?
              case "$rc" in
                0) replaced=$((replaced + 1)); consec=0 ;;
                10) marked=$((marked + 1)); consec=0 ;;
                11) orphans2=$((orphans2 + 1)); echo "$key" >> "$RUN_DIR/orphans.txt" ;;
                *) failed=$((failed + 1)); consec=$((consec + 1)); echo "$key" >> "$RUN_DIR/failed.txt"
                   echo "::error::Fallo al procesar un objeto (código ${rc}): ${key}"
                   # Salvaguarda: 3 fallos CONSECUTIVOS paran la ejecución (un éxito reinicia).
                   if [ "$consec" -ge 3 ]; then aborted=1; break; fi ;;
              esac
            done 3< "$RUN_DIR/selected.tsv"

            list_all > "$RUN_DIR/list_after.tsv"
            local after_n after_b deleted
            read -r after_n after_b < <(totals "$RUN_DIR/list_after.tsv")
            deleted="$(wc -l < "$RUN_DIR/deleted.log")"

            local pb pa vb va
            read -r pb pa < <(awk '$1=="photo"{b+=$2;a+=$3} END{printf "%d %d\n", b+0, a+0}' "$RUN_DIR/bytes.tsv")
            read -r vb va < <(awk '$1=="video"{b+=$2;a+=$3} END{printf "%d %d\n", b+0, a+0}' "$RUN_DIR/bytes.tsv")

            echo "Bucket después: ${after_n} objetos, ${after_b} bytes"
            {
              echo "### Media optimize"
              echo "| Concepto | Valor |"
              echo "|---|---:|"
              echo "| Reemplazados | ${replaced} |"
              echo "| Original conservado (solo marcado) | ${marked} |"
              echo "| Fallidos | ${failed} |"
              echo "| Huérfanos (omitidos) | $((orphans + orphans2)) |"
              echo "| Originales borrados | ${deleted} |"
              echo "| Fotos: bytes antes / después | ${pb} / ${pa} |"
              echo "| Vídeos: bytes antes / después | ${vb} / ${va} |"
              echo "| Bucket antes: objetos / bytes | ${before_n} / ${before_b} |"
              echo "| Bucket después: objetos / bytes | ${after_n} / ${after_b} |"
            } >> "$GITHUB_STEP_SUMMARY"

            if [ -s "$RUN_DIR/failed.txt" ]; then
              echo "Claves con fallo:"; cat "$RUN_DIR/failed.txt"
              { echo; echo "Claves con fallo:"; echo '```'; cat "$RUN_DIR/failed.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -s "$RUN_DIR/orphans.txt" ]; then
              echo "Claves huérfanas (sin fila en manteniment_adjunts):"; cat "$RUN_DIR/orphans.txt"
            fi
            echo "Duración total: $((SECONDS - T0)) s"
            if [ "$aborted" = 1 ]; then
              echo "::error::Abortado: 3 fallos consecutivos ($((selected - attempted)) candidatos sin procesar)."
              return 1
            fi
            if [ "$failed" -gt 0 ]; then
              echo "::error::${failed} objeto(s) han fallado; el resto se ha procesado."
              return 1
            fi
          }

          if [ "${BASH_SOURCE[0]}" = "$0" ]; then
            case "${1:-main}" in
              main) main ;;
              one)
                shift
                WORKDIR=""
                trap 'rm -rf "${WORKDIR:-}" || true' EXIT
                one "$@"
                ;;
              probe) shift; probe "$@" ;;
              *) echo "uso: $0 [main|one]" >&2; exit 2 ;;
            esac
          fi
          MEDIA_OPTIMIZE_SCRIPT
          bash "$SCRIPT" main

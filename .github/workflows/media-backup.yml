name: Media backup (R2 to R2)

# Copia ADITIVA diaria (espejo de la ÚLTIMA versión, sin borrar nunca) de los adjuntos de mantenimiento (fotos, vídeos, notas de
# voz, documentos) del bucket R2 en producción a un segundo bucket R2 privado.
#
#   Origen:  sleepingbcn-manteniment      (solo lectura para este job)
#   Destino: sleepingbcn-backups-media    (privado, creado vacío)
#
# Secrets necesarios (los 5 ya existen; nunca se imprimen):
#   R2_BACKUP_ENDPOINT                 https://<account-id>.r2.cloudflarestorage.com
#   R2_MEDIA_SRC_ACCESS_KEY_ID         \ token con lectura de objetos SOLO sobre
#   R2_MEDIA_SRC_SECRET_ACCESS_KEY     / sleepingbcn-manteniment
#   R2_MEDIA_DST_ACCESS_KEY_ID         \ token con lectura y escritura de objetos SOLO
#   R2_MEDIA_DST_SECRET_ACCESS_KEY     / sobre sleepingbcn-backups-media
#
# Diseño:
# - La copia refleja la ÚLTIMA versión de cada objeto vivo: si el optimizador
#   de medios reemplaza un objeto en el sitio (misma clave, nuevo tamaño), la
#   copia se sobrescribe en la siguiente ejecución. Criterio: solo tamaño.
# - El bucket de destino NO tiene regla de ciclo de vida / borrado a propósito:
#   la copia solo crece. Los borrados en el origen NO se propagan al destino.
# - El token de origen es de solo lectura y el de destino solo puede escribir en
#   el bucket de backup, así que ni un fallo de este workflow puede tocar los
#   adjuntos reales.
# - Como los dos buckets usan credenciales distintas no hay copia en el servidor:
#   rclone transmite los objetos a través del runner (R2 no cobra egress, el
#   volumen es pequeño y solo se copian los objetos nuevos o modificados en cada ejecución).
# - Las claves se mantienen idénticas en el destino (sin prefijo extra).
#
# Restaurar (requiere un token con escritura sobre el bucket de origen):
#   rclone copy dst:sleepingbcn-backups-media src:sleepingbcn-manteniment --ignore-existing

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-pipeline
  cancel-in-progress: false

env:
  # Ojo: no llamar a esta variable RCLONE_*. rclone interpreta cualquier
  # RCLONE_<FLAG> del entorno como una opción suya (RCLONE_VERSION se tomaba
  # como --version y abortaba la ejecución). Solo se permiten las documentadas
  # RCLONE_CONFIG_<REMOTE>_*.
  MEDIA_RCLONE_VERSION: "1.75.1"
  MEDIA_SRC_BUCKET: "sleepingbcn-manteniment"
  MEDIA_DST_BUCKET: "sleepingbcn-backups-media"

jobs:
  backup:
    name: Copiar adjuntos a bucket de backup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Instalar rclone
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rclone.zip \
            "https://github.com/rclone/rclone/releases/download/v${MEDIA_RCLONE_VERSION}/rclone-v${MEDIA_RCLONE_VERSION}-linux-amd64.zip"
          unzip -q /tmp/rclone.zip -d /tmp
          sudo mv "/tmp/rclone-v${MEDIA_RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1

      - name: Copiar objetos nuevos o modificados (sin borrar)
        env:
          RCLONE_CONFIG_SRC_TYPE: s3
          RCLONE_CONFIG_SRC_PROVIDER: Cloudflare
          RCLONE_CONFIG_SRC_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_SRC_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SRC_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_SRC_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          RCLONE_CONFIG_SRC_REGION: auto
          RCLONE_CONFIG_SRC_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_DST_TYPE: s3
          RCLONE_CONFIG_DST_PROVIDER: Cloudflare
          RCLONE_CONFIG_DST_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_DST_ACCESS_KEY_ID }}
          RCLONE_CONFIG_DST_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_DST_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_DST_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          RCLONE_CONFIG_DST_REGION: auto
          RCLONE_CONFIG_DST_NO_CHECK_BUCKET: "true"
        run: |
          set -euo pipefail
          # COMPROMISO ACEPTADO POR EL PROPIETARIO:
          # - La copia refleja la ÚLTIMA versión de cada objeto vivo. El
          #   optimizador de medios reemplaza objetos en el sitio (misma clave,
          #   menos bytes), así que la copia debe sobrescribirse. Consecuencia:
          #   un objeto vivo corrupto sobrescribiría su copia en la siguiente
          #   ejecución.
          # - Los borrados en el origen NUNCA se propagan: solo "rclone copy",
          #   jamás sync/move/--delete-*/purge.
          # - --size-only: las fechas pueden diferir entre buckets (el
          #   optimizador escribe con PUT sin mtime de rclone) y no queremos
          #   recopiarlo todo por eso. El optimizador solo conserva un
          #   reemplazo si es más pequeño, así que cambia siempre el tamaño.
          # -v (INFO) imprime "Copied" por cada objeto transferido; se guarda
          # el log para resumir cuántos objetos y bytes se han copiado.
          rclone copy "src:${MEDIA_SRC_BUCKET}" "dst:${MEDIA_DST_BUCKET}" \
            --size-only \
            --transfers 4 --checkers 8 \
            -v --stats 30s --stats-one-line --stats-log-level NOTICE \
            2>&1 | tee /tmp/rclone-copy.log

          COPIED="$(grep -c 'INFO  : .*: Copied' /tmp/rclone-copy.log || true)"
          STATS="$(grep -E 'ETA|, 100%' /tmp/rclone-copy.log | tail -1 | sed 's/^ *//' || true)"
          echo "Objetos copiados en esta ejecución: ${COPIED}"
          {
            echo "### Copia de medios"
            echo "- Objetos nuevos o modificados, copiados: ${COPIED}"
            echo "- Estadísticas rclone: \`${STATS:-sin transferencias}\`"
            if [ "$COPIED" -gt 0 ]; then
              echo "- Claves:"
              grep 'INFO  : .*: Copied' /tmp/rclone-copy.log | sed -E 's/^.*INFO  : (.*): Copied.*/  - \1/' | head -50
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar copia
        env:
          RCLONE_CONFIG_SRC_TYPE: s3
          RCLONE_CONFIG_SRC_PROVIDER: Cloudflare
          RCLONE_CONFIG_SRC_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_SRC_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SRC_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_SRC_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          RCLONE_CONFIG_SRC_REGION: auto
          RCLONE_CONFIG_SRC_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_DST_TYPE: s3
          RCLONE_CONFIG_DST_PROVIDER: Cloudflare
          RCLONE_CONFIG_DST_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_DST_ACCESS_KEY_ID }}
          RCLONE_CONFIG_DST_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_DST_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_DST_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          RCLONE_CONFIG_DST_REGION: auto
          RCLONE_CONFIG_DST_NO_CHECK_BUCKET: "true"
        run: |
          set -euo pipefail

          # a) Mismo criterio que la copia (--size-only): cada objeto del origen
          #    debe existir en el destino con el mismo tamaño (--one-way: los objetos extra del destino son normales).
          #    Si falla, puede ser un adjunto subido entre la copia y la
          #    comprobación: se repite la copia UNA vez y se comprueba de nuevo;
          #    si vuelve a fallar, el job falla.
          CHECK_CMD=(rclone check "src:${MEDIA_SRC_BUCKET}" "dst:${MEDIA_DST_BUCKET}"
            --one-way --size-only --log-level NOTICE)

          if ! "${CHECK_CMD[@]}"; then
            echo "::warning::La comprobación ha fallado; se repite la copia una vez (posible subida concurrente)."
            rclone copy "src:${MEDIA_SRC_BUCKET}" "dst:${MEDIA_DST_BUCKET}" \
              --size-only \
              --transfers 4 --checkers 8 \
              --log-level NOTICE --stats 30s --stats-one-line --stats-log-level NOTICE
            if ! "${CHECK_CMD[@]}"; then
              echo "::error::Hay objetos del origen que faltan en el destino o con distinto tamaño tras reintentar."
              exit 1
            fi
          fi
          echo "Comprobación OK: todo objeto del origen existe en el destino con el mismo tamaño."

          # b) Recuento y bytes de ambos buckets (solo números).
          SRC_JSON="$(rclone size --json "src:${MEDIA_SRC_BUCKET}")"
          DST_JSON="$(rclone size --json "dst:${MEDIA_DST_BUCKET}")"
          SRC_COUNT="$(echo "$SRC_JSON" | jq -r '.count')"
          SRC_BYTES="$(echo "$SRC_JSON" | jq -r '.bytes')"
          DST_COUNT="$(echo "$DST_JSON" | jq -r '.count')"
          DST_BYTES="$(echo "$DST_JSON" | jq -r '.bytes')"

          echo "Origen:  ${SRC_COUNT} objetos, ${SRC_BYTES} bytes"
          echo "Destino: ${DST_COUNT} objetos, ${DST_BYTES} bytes"

          {
            echo "| Bucket | Objetos | Bytes |"
            echo "|---|---:|---:|"
            echo "| ${MEDIA_SRC_BUCKET} (origen) | ${SRC_COUNT} | ${SRC_BYTES} |"
            echo "| ${MEDIA_DST_BUCKET} (backup) | ${DST_COUNT} | ${DST_BYTES} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # c) El destino nunca puede tener menos objetos que el origen.
          if [ "$DST_COUNT" -lt "$SRC_COUNT" ]; then
            echo "::error::El destino tiene menos objetos (${DST_COUNT}) que el origen (${SRC_COUNT})."
            exit 1
          fi
